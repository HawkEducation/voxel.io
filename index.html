<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Minecraft - Smooth HTML5 Canvas</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        canvas {
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            background-color: skyblue;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// --- 4x4 TEXTURE DATA ---
const TEXTURES = {
    "wood": [
        ["#8B5A2B", "#A0522D", "#A0522D", "#8B5A2B"],
        ["#CD853F", "#CD853F", "#8B5A2B", "#A0522D"],
        ["#A0522D", "#8B5A2B", "#CD853F", "#CD853F"],
        ["#8B5A2B", "#A0522D", "#A0522D", "#8B5A2B"]
    ],
    "grass": [
        ["#2E8B57", "#3CB371", "#2E8B57", "#3CB371"],
        ["#3CB371", "#228B22", "#228B22", "#2E8B57"],
        ["#556B2F", "#8B5A2B", "#556B2F", "#8B5A2B"],
        ["#8B5A2B", "#8B5A2B", "#8B5A2B", "#8B5A2B"]
    ],
    "water": [
        ["#1E90FF", "#00BFFF", "#1E90FF", "#1E90FF"],
        ["#00BFFF", "#4169E1", "#4169E1", "#00BFFF"],
        ["#1E90FF", "#1E90FF", "#00BFFF", "#4169E1"],
        ["#4169E1", "#00BFFF", "#1E90FF", "#1E90FF"]
    ],
    "sand": [
        ["#F4A460", "#EDC9AF", "#EDC9AF", "#F4A460"],
        ["#EDC9AF", "#F4A460", "#F4A460", "#EDC9AF"],
        ["#F4A460", "#EDC9AF", "#EDC9AF", "#F4A460"],
        ["#EDC9AF", "#F4A460", "#F4A460", "#EDC9AF"]
    ],
    "stone": [
        ["#708090", "#808080", "#A9A9A9", "#708090"],
        ["#808080", "#A9A9A9", "#708090", "#808080"],
        ["#A9A9A9", "#708090", "#808080", "#A9A9A9"],
        ["#708090", "#808080", "#A9A9A9", "#708090"]
    ],
    "dirt": [
        ["#8B5A2B", "#5C4033", "#8B5A2B", "#5C4033"],
        ["#5C4033", "#8B5A2B", "#5C4033", "#8B5A2B"],
        ["#8B5A2B", "#5C4033", "#8B5A2B", "#5C4033"],
        ["#5C4033", "#8B5A2B", "#5C4033", "#8B5A2B"]
    ],
    "leaves": [
        ["#32CD32", "#228B22", "#32CD32", "#98FB98"],
        ["#008000", "#006400", "#008000", "#32CD32"],
        ["#228B22", "#008000", "#228B22", "#006400"],
        ["#98FB98", "#32CD32", "#008000", "#228B22"]
    ]
};

const BLOCK_TYPES = ["wood", "grass", "water", "sand", "stone", "dirt", "leaves"];

const PIXEL_SIZE = 10;  
const BLOCK_SIZE = 4;   
const GRID_SIZE = BLOCK_SIZE * PIXEL_SIZE;  

const WIDTH = 800;
const HEIGHT = 600;

const GRAVITY = 0.6;
const JUMP_FORCE = -11;
const MOVE_SPEED = 4;
const PLAYER_WIDTH = 24;
const PLAYER_HEIGHT = 40;  

class Minecraft2D {
    constructor() {
        this.world = {};
        this.current_block_type = "wood";
        this.camera_x = 0;  
        
        this.player_x = WIDTH / 2;
        this.player_y = 50;
        this.player_vy = 0;  
        this.on_ground = false;
        
        this.anim_frame = 0;
        this.is_moving = false;
        this.keys = { "a": false, "d": false };
        
        this.initEventListeners();
        this.createBiomeWorld();
        
        // --- SMOOTH TIMING SYSTEM ---
        this.lastTime = performance.now();
        this.accumulator = 0;
        this.timestep = 1000 / 50; // Target strict 50 physics updates per second (20ms per tick)

        // Kick off the loop synced to the monitor frame rate
        requestAnimationFrame((timestamp) => this.smoothGameLoop(timestamp));
    }

    initEventListeners() {
        // Keyboard inputs
        window.addEventListener("keydown", (e) => {
            if (e.key === "a" || e.key === "A") this.keys["a"] = true;
            if (e.key === "d" || e.key === "D") this.keys["d"] = true;
            if (e.key === " ") {
                this.jump();
                e.preventDefault();
            }
            // Hotbar selection keys 1-7
            if (e.key >= "1" && e.key <= "7") {
                this.current_block_type = BLOCK_TYPES[parseInt(e.key) - 1];
            }
        });

        window.addEventListener("keyup", (e) => {
            if (e.key === "a" || e.key === "A") this.keys["a"] = false;
            if (e.key === "d" || e.key === "D") this.keys["d"] = false;
        });

        // Mouse clicks (Left click to build, Right/Middle click to mine)
        canvas.addEventListener("mousedown", (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            if (e.button === 0) {
                this.placeBlock(mouseX, mouseY);
            } else if (e.button === 2 || e.button === 1) {
                this.destroyBlock(mouseX, mouseY);
            }
        });

        // Block contextual popups on right click
        canvas.addEventListener("contextmenu", e => e.preventDefault());
    }

    createBiomeWorld() {
        const floor_y = Math.floor(HEIGHT / GRID_SIZE) - 3;
        const rows = Math.floor(HEIGHT / GRID_SIZE);
        
        for (let x = -50; x <= 50; x++) {
            let biome = "forest";
            if (x < -15) biome = "ocean";
            else if (x > 15) biome = "desert";
                
            if (biome === "ocean") {
                this.world[`${x},${floor_y}`] = "water";
                for (let y = floor_y + 1; y < rows; y++) {
                    this.world[`${x},${y}`] = "sand";
                }
            } else if (biome === "desert") {
                this.world[`${x},${floor_y}`] = "sand";
                for (let y = floor_y + 1; y < rows; y++) {
                    if (y > floor_y + 2) {
                        this.world[`${x},${y}`] = "stone";
                    } else {
                        this.world[`${x},${y}`] = "sand";
                    }
                }
            } else if (biome === "forest") {
                this.world[`${x},${floor_y}`] = "grass";
                for (let y = floor_y + 1; y < rows; y++) {
                    this.world[`${x},${y}`] = "dirt";
                }
                
                if (x !== 10 && x !== 9 && x !== 11 && Math.random() < 0.07) {
                    this.growTree(x, floor_y - 1);
                }
            }
        }
    }

    growTree(trunk_x, base_y) {
        const tree_height = Math.floor(Math.random() * 2) + 2; 
        for (let i = 0; i < tree_height; i++) {
            this.world[`${trunk_x},${base_y - i}`] = "wood";
        }
        
        const top_y = base_y - tree_height;
        for (let leaf_x = trunk_x - 1; leaf_x <= trunk_x + 1; leaf_x++) {
            for (let leaf_y = top_y - 1; leaf_y <= top_y; leaf_y++) {
                if (!this.world[`${leaf_x},${leaf_y}`]) {
                    this.world[`${leaf_x},${leaf_y}`] = "leaves";
                }
            }
        }
        
        const extra_leaf_spots = [
            [trunk_x, top_y - 2],
            [trunk_x - 1, top_y],
            [trunk_x + 1, top_y]
        ];
        
        for (let [lx, ly] of extra_leaf_spots) {
            if (!this.world[`${lx},${ly}`]) {
                this.world[`${lx},${ly}`] = "leaves";
            }
        }
    }

    drawBlock(grid_x, grid_y, block_type) {
        const start_x = (grid_x * GRID_SIZE) - this.camera_x;
        const start_y = grid_y * GRID_SIZE;
        const pattern = TEXTURES[block_type];
        
        for (let row = 0; row < BLOCK_SIZE; row++) {
            for (let col = 0; col < BLOCK_SIZE; col++) {
                ctx.fillStyle = pattern[row][col];
                ctx.fillRect(
                    start_x + (col * PIXEL_SIZE),
                    start_y + (row * PIXEL_SIZE),
                    PIXEL_SIZE,
                    PIXEL_SIZE
                );
            }
        }
    }

    placeBlock(mouseX, mouseY) {
        if (mouseY > HEIGHT - 80) return; 
        const true_x = mouseX + this.camera_x;
        const grid_x = Math.floor(true_x / GRID_SIZE);
        const grid_y = Math.floor(mouseY / GRID_SIZE);
        
        const block_left = grid_x * GRID_SIZE;
        const block_right = block_left + GRID_SIZE;
        const block_top = grid_y * GRID_SIZE;
        const block_bottom = block_top + GRID_SIZE;
        
        const player_right = this.player_x + PLAYER_WIDTH;
        const player_bottom = this.player_y + PLAYER_HEIGHT;
        
        const is_overlapping_player = (
            this.player_x < block_right && 
            player_right > block_left && 
            this.player_y < block_bottom && 
            player_bottom > block_top
        );
        
        if (!this.world[`${grid_x},${grid_y}`] && !is_overlapping_player) {
            this.world[`${grid_x},${grid_y}`] = this.current_block_type;
        }
    }

    destroyBlock(mouseX, mouseY) {
        const true_x = mouseX + this.camera_x;
        const grid_x = Math.floor(true_x / GRID_SIZE);
        const grid_y = Math.floor(mouseY / GRID_SIZE);
        
        if (this.world[`${grid_x},${grid_y}`]) {
            delete this.world[`${grid_x},${grid_y}`];
        }
    }

    jump() {
        if (this.on_ground) {
            this.player_vy = JUMP_FORCE;
            this.on_ground = false;
        }
    }

    checkCollision(x, y) {
        const left_grid = Math.floor(x / GRID_SIZE);
        const right_grid = Math.floor((x + PLAYER_WIDTH - 1) / GRID_SIZE);
        const top_grid = Math.floor(y / GRID_SIZE);
        const bottom_grid = Math.floor((y + PLAYER_HEIGHT - 1) / GRID_SIZE);
        
        for (let gx = left_grid; gx <= right_grid; gx++) {
            for (let gy = top_grid; gy <= bottom_grid; gy++) {
                if (this.world[`${gx},${gy}`]) {
                    if (this.world[`${gx},${gy}`] === "water") continue;
                    return true;
                }
            }
        }
        return false;
    }

    drawPlayer(spx, spy, swing_offset, lift_offset) {
        const drawPart = (x1, y1, x2, y2, fill, outline) => {
            ctx.fillStyle = fill;
            ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
            if (outline) {
                ctx.strokeStyle = outline;
                ctx.lineWidth = 1;
                ctx.strokeRect(x1, y1, x2 - x1, y2 - y1);
            }
        };

        // Hair & Head
        drawPart(spx + 4, spy, spx + 20, spy + 4, "#4A2E1B", "");
        drawPart(spx + 4, spy + 4, spx + 20, spy + 14, "#FFD1A4", "#E0A97E");
        
        // Torso / Shirt
        drawPart(spx + 4, spy + 14, spx + 20, spy + 28, "#0080FF", "#0059B3");
        
        // Left Arm & Hand
        drawPart(spx, spy + 14 + swing_offset, spx + 4, spy + 26 + swing_offset, "#0080FF", "#0059B3");
        drawPart(spx, spy + 26 + swing_offset, spx + 4, spy + 30 + swing_offset, "#FFD1A4", "");
        
        // Right Arm & Hand
        drawPart(spx + 20, spy + 14 - swing_offset, spx + 24, spy + 26 - swing_offset, "#0080FF", "#0059B3");
        drawPart(spx + 20, spy + 26 - swing_offset, spx + 24, spy + 30 - swing_offset, "#FFD1A4", "");
        
        // Left Leg & Boot
        drawPart(spx + 4 + swing_offset, spy + 28, spx + 11 + swing_offset, spy + 36 - lift_offset, "#333333", "#1A1A1A");
        drawPart(spx + 3 + swing_offset, spy + 36 - lift_offset, spx + 11 + swing_offset, spy + 40 - lift_offset, "#5C4033", "");
        
        // Right Leg & Boot
        drawPart(spx + 13 - swing_offset, spy + 28, spx + 20 - swing_offset, spy + 36 - lift_offset, "#262626", "#1A1A1A");
        drawPart(spx + 12 - swing_offset, spy + 36 - lift_offset, spx + 20 - swing_offset, spy + 40 - lift_offset, "#442D22", "");
    }

    drawHotbar() {
        const start_x = WIDTH / 2 - (BLOCK_TYPES.length * 50) / 2;
        const y1 = HEIGHT - 65;
        
        // Hotbar Container Box
        ctx.fillStyle = "#1A1A1A";
        ctx.strokeStyle = "#333333";
        ctx.lineWidth = 3;
        ctx.fillRect(start_x - 5, y1 - 5, (BLOCK_TYPES.length * 50) + 10, 60);
        ctx.strokeRect(start_x - 5, y1 - 5, (BLOCK_TYPES.length * 50) + 10, 60);

        BLOCK_TYPES.forEach((b_type, i) => {
            const slot_x = start_x + (i * 50);
            const is_selected = (b_type === this.current_block_type);
            
            ctx.fillStyle = is_selected ? "#555566" : "#444444";
            ctx.strokeStyle = is_selected ? "#FF8800" : "#888888";
            ctx.lineWidth = is_selected ? 3 : 2;
            ctx.fillRect(slot_x, y1, 45, 45);
            ctx.strokeRect(slot_x, y1, 45, 45);
            
            const pattern = TEXTURES[b_type];
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    ctx.fillStyle = pattern[r][c];
                    ctx.fillRect(slot_x + 6 + (c * 8), y1 + 6 + (r * 8), 8, 8);
                }
            }
            
            ctx.fillStyle = "white";
            ctx.font = "bold 10px Arial";
            ctx.fillText(i + 1, slot_x + 6, y1 + 14);
        });
    }

    smoothGameLoop(timestamp) {
        let dt = timestamp - this.lastTime;
        if (dt > 250) dt = 250; // Safeguard if user updates tabs
        this.lastTime = timestamp;

        this.accumulator += dt;

        // Catch up on fixed updates matching original tickrate
        while (this.accumulator >= this.timestep) {
            this.updatePhysics();
            this.accumulator -= this.timestep;
        }

        // Draw the frame cleanly
        this.render();

        requestAnimationFrame((t) => this.smoothGameLoop(t));
    }

    updatePhysics() {
        let dx = 0;
        if (this.keys["a"]) { dx -= MOVE_SPEED; this.is_moving = true; }
        if (this.keys["d"]) { dx += MOVE_SPEED; this.is_moving = true; }
        if (!this.keys["a"] && !this.keys["d"]) this.is_moving = false;
        
        if (dx !== 0) {
            if (!this.checkCollision(this.player_x + dx, this.player_y)) {
                this.player_x += dx;
            }
        }

        // Apply Gravity
        this.player_vy += GRAVITY;
        if (this.player_vy > 10) this.player_vy = 10;
        
        let new_y = this.player_y + this.player_vy;
        
        if (!this.checkCollision(this.player_x, new_y)) {
            this.player_y = new_y;
            this.on_ground = false;
        } else {
            if (this.player_vy > 0) {
                this.on_ground = true;
                let collided_row = Math.floor((new_y + PLAYER_HEIGHT) / GRID_SIZE);
                this.player_y = (collided_row * GRID_SIZE) - PLAYER_HEIGHT - 1;
            }
            this.player_vy = 0;
        }

        // Animation counter
        if (this.is_moving && this.on_ground) {
            this.anim_frame += 0.3;
        } else {
            this.anim_frame = 0;
        }

        // Shift view field camera
        this.camera_x = this.player_x - (WIDTH / 2) + (PLAYER_WIDTH / 2);
    }

    render() {
        ctx.fillStyle = "skyblue";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        const swing_offset = Math.sin(this.anim_frame) * 5;
        const lift_offset = this.is_moving ? Math.abs(Math.cos(this.anim_frame)) * 2 : 0;

        // Render environment
        for (let key in this.world) {
            const [gx, gy] = key.split(",").map(Number);
            this.drawBlock(gx, gy, this.world[key]);
        }

        // Render dynamic entities
        const spx = this.player_x - this.camera_x;
        const spy = this.player_y;
        this.drawPlayer(spx, spy, swing_offset, lift_offset);

        // Render UI overlay
        this.hotbar_slots = []; 
        this.drawHotbar();
    }
}

// Open engine
new Minecraft2D();
</script>

</body>
</html>
